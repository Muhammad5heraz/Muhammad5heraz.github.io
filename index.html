<style>
@property --bc{syntax:'<color>';inherits:true;initial-value:#E1306C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050608;color:#EEEAE3;font:16px/1.4 'DM Sans',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
svg{display:block}
a{color:inherit;text-decoration:none}
.stage{position:fixed;inset:0;overflow:hidden}
/* photo */
.bg{position:absolute;left:-10vw;top:-24dvh;width:165vw;height:128dvh;object-fit:cover;object-position:50% 40%;
  animation:bgIn 2.2s cubic-bezier(.2,.7,.2,1) both,breathe 14s ease-in-out 2.2s infinite alternate;will-change:transform}
@keyframes bgIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035) translate(-.4%,.3%)}}
.vig{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#050608 0%,rgba(5,6,8,.82) 34%,rgba(5,6,8,0) 64%),
  linear-gradient(180deg,rgba(5,6,8,.92) 0%,rgba(5,6,8,0) 26%,rgba(5,6,8,0) 80%,rgba(5,6,8,.95) 100%)}
.beam{position:absolute;left:0;top:0;width:min(80vw,900px);height:150px;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(ellipse at 0% 50%,color-mix(in srgb,var(--bc) 46%,transparent),transparent 66%);filter:blur(12px);
  transition:transform .8s cubic-bezier(.2,.8,.2,1),--bc .8s ease,opacity .8s;transform:translate(120px,0) rotate(-6deg);transform-origin:0 50%}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* layout */
.wrap{position:absolute;inset:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom));max-width:100%}
.top{display:flex;justify-content:flex-end;padding:8px 6px 0}
.moon{display:flex;gap:8px;align-items:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#BFB9AD;animation:fade 1.4s .9s both}
.moon i{width:8px;height:8px;border-radius:50%;background:#F3C98B;box-shadow:0 0 12px #F3C98B;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font:400 clamp(34px,min(13.4vw,8.4dvh),56px)/.95 'Instrument Serif',serif;letter-spacing:-.01em;padding:clamp(6px,2dvh,18px) 6px 0}
h1 span{display:block;overflow:hidden;padding-bottom:.08em}
h1 span i{display:block;font-style:normal;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
h1 span:nth-child(1) i{animation-delay:.35s}h1 span:nth-child(2) i{animation-delay:.5s}
@keyframes rise{from{transform:translateY(105%);filter:blur(6px)}to{transform:none;filter:none}}
.sub{padding:6px 8px clamp(4px,1.6dvh,14px);color:#8F939B;font-size:14px;animation:fade 1.2s .8s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.list{position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;align-self:stretch;gap:2px;width:min(230px,62vw)}
.row{position:relative;flex:1 1 0;max-height:46px;min-height:0;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:14px;color:#A9ADB4;opacity:0;
  animation:rowIn .8s cubic-bezier(.2,.8,.2,1) calc(.9s + var(--i)*.055s) forwards;transition:color .4s,background .5s,box-shadow .5s;outline:none}
@keyframes rowIn{from{opacity:0;transform:translateX(-18px)}to{opacity:.8;transform:none}}
.row .g{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.04);transition:background .4s,box-shadow .5s,transform .5s cubic-bezier(.2,.8,.2,1);flex:none}
.row .g svg{width:20px;height:20px}
.row b{font-weight:500;font-size:clamp(14px,2.1dvh,16px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.row.lit{opacity:1!important;color:#fff;background:linear-gradient(90deg,color-mix(in srgb,var(--b) 30%,transparent),transparent 92%);box-shadow:inset 2px 0 0 var(--b)}
.row.lit .g{background:#0A0C0F;box-shadow:0 0 22px -2px var(--b);transform:scale(1.08)}
.row.lit b{transform:translateX(4px)}
.hint{text-align:center;padding-top:6px;font:400 11px 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:#6E737B;animation:fade 1.4s 2s both}
/* flood on tap */
.flood{position:fixed;width:20px;height:20px;border-radius:50%;margin:-10px 0 0 -10px;background:var(--bc);pointer-events:none;z-index:9;transform:scale(0);transition:transform .55s cubic-bezier(.6,0,.2,1)}
.flood.go{transform:scale(160)}
/* desktop */
.ghost,.clock2,.frame{display:none}
@media (min-aspect-ratio:1/1){

 .wrap{position:absolute;right:auto;width:min(560px,42vw);padding-left:max(36px,5.5vw);padding-right:20px;padding-top:max(22px,3.5dvh);padding-bottom:max(22px,3.5dvh)}
 .top{height:0;padding:0;overflow:hidden;visibility:hidden}
 h1{font-size:clamp(44px,min(7vw,12dvh),104px);padding-left:6px}
 .sub{font-size:clamp(14px,1.9dvh,17px);padding-bottom:clamp(8px,3dvh,28px)}

 .row .g{width:clamp(28px,4.4dvh,36px);height:clamp(28px,4.4dvh,36px)}
 .row .g svg{width:60%;height:60%}
 .row b{font-size:clamp(15px,2.5dvh,19px)}
 .hint{text-align:left;padding-left:8px}
 .ghost{display:block;position:absolute;left:21vw;bottom:-3dvh;font:400 clamp(160px,27vw,480px)/.8 'Instrument Serif',serif;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px rgba(243,201,139,.22);pointer-events:none;white-space:nowrap;animation:fade 3s 1.2s both}
 .frame{display:block;position:absolute;right:clamp(28px,3.6vw,64px);top:clamp(22px,3.5dvh,40px);bottom:clamp(22px,3.5dvh,40px);width:1px;background:linear-gradient(180deg,transparent,rgba(243,201,139,.35) 20%,rgba(243,201,139,.35) 80%,transparent);animation:fade 2s 1.4s both;pointer-events:none}
 .clock2{display:block;position:absolute;right:clamp(48px,5.6vw,96px);bottom:clamp(26px,5dvh,56px);text-align:right;animation:fade 2s 1.6s both}
 .clock2 .t{font:400 clamp(44px,9dvh,92px)/1 'Instrument Serif',serif;letter-spacing:-.02em;color:#F1ECE2;text-shadow:0 0 40px rgba(243,201,139,.25)}
 .clock2 .t small{font:500 clamp(12px,1.8dvh,16px) 'DM Sans';letter-spacing:.2em;color:#F3C98B;margin-left:8px;vertical-align:top;position:relative;top:.6em}
 .clock2 .p{margin-top:8px;font-size:clamp(10.5px,1.5dvh,12.5px);letter-spacing:.22em;text-transform:uppercase;color:#8F939B}
 .clock2 .p i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F3C98B;box-shadow:0 0 12px #F3C98B;margin-right:9px;animation:pulse 3s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){

}

<script>
(function(){
  var list=document.getElementById('list'),beam=document.getElementById('beam'),rows=[].slice.call(list.children),cur=-1,last=0;
  function light(i){
    if(i===cur||!rows[i])return;
    if(rows[cur])rows[cur].classList.remove('lit');
    cur=i;var r=rows[i];r.classList.add('lit');
    var lr=list.getBoundingClientRect(),rr=r.getBoundingClientRect();
    beam.style.setProperty('--bc',getComputedStyle(r).getPropertyValue('--b'));
    beam.style.opacity='1';
    beam.style.transform='translate('+(rr.left+60)+'px,'+(rr.top+rr.height/2-75)+'px) rotate(-6deg)';
  }
  function touchedAt(i){last=Date.now();light(i)}
  rows.forEach(function(r,i){
    r.addEventListener('pointerenter',function(){touchedAt(i)});
    r.addEventListener('pointerdown',function(){touchedAt(i)});
    r.addEventListener('focus',function(){touchedAt(i)});
  });
  list.addEventListener('pointermove',function(e){
    var el=document.elementFromPoint(e.clientX,e.clientY);var row=el&&el.closest&&el.closest('.row');
    if(row){var i=rows.indexOf(row);if(i>-1)touchedAt(i)}
  });
  // idle searchlight patrols the list
  setTimeout(function(){light(0)},1500);
  setInterval(function(){if(Date.now()-last>5000){light((cur+1)%rows.length)}},2600);
  window.addEventListener('resize',function(){var c=cur;cur=-1;light(c<0?0:c)});
  // tap: colour floods the screen, then travel
  var fl=document.createElement('div');fl.className='flood';document.body.appendChild(fl);
  list.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button||a.id==='mail'||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    e.preventDefault();
    fl.style.setProperty('--bc',getComputedStyle(a).getPropertyValue('--b'));
    fl.style.left=e.clientX+'px';fl.style.top=e.clientY+'px';
    void fl.offsetWidth;fl.classList.add('go');
    setTimeout(function(){location.href=a.href},420);
  });
  window.addEventListener('pageshow',function(){fl.classList.remove('go')});
  // email assembled in script so it isn't scraped
  var addr=["anshshoukat","gmail.com"].join("@"),m=document.getElementById('mail');
  m.href="mailto:"+addr;
  // Faisalabad clock
  var ck=document.getElementById('clock');
  function tick(){try{ck.textContent="Faisalabad · "+new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Karachi"}).format(new Date())}catch(e){}}
  function tick2(){try{var p=new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Karachi"}).formatToParts(new Date()),h='',m='',a='';p.forEach(function(x){if(x.type==='hour')h=x.value;if(x.type==='minute')m=x.value;if(x.type==='dayPeriod')a=x.value});document.getElementById('t2').textContent=h+':'+m;document.getElementById('ap').textContent=a}catch(e){}}
  tick();tick2();setInterval(function(){tick();tick2()},1000);
  // photo drifts a touch with the pointer
  var bg=document.getElementById('bg');
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&matchMedia('(hover:hover)').matches){
    window.addEventListener('pointermove',function(e){
      var x=(e.clientX/innerWidth-.5)*-14,y=(e.clientY/innerHeight-.5)*-10;
      bg.style.translate=x+'px '+y+'px';
    });
    bg.style.transition='translate .8s ease-out';
  }
  // dust motes in the beam
  var c=document.getElementById('dust'),x=c.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2),M=[];
  function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}
  size();addEventListener('resize',size);
  for(var k=0;k<46;k++)M.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.4,s:Math.random()*.00006+.00002,p:Math.random()*6.28});
  (function loop(t){
    x.clearRect(0,0,W,H);
    M.forEach(function(m){
      m.y-=m.s*16;m.x+=Math.sin(t/3000+m.p)*.00006;if(m.y<-.02){m.y=1.02;m.x=Math.random()}
      var a=(.25+.35*Math.sin(t/900+m.p))*Math.min(1,m.x*1.6);
      x.fillStyle='rgba(243,201,139,'+Math.max(0,a)+')';x.beginPath();x.arc(m.x*W,m.y*H,m.r*dpr,0,6.28);x.fill();
    });
    requestAnimationFrame(loop);
  })(0);
})();
</script>
